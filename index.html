<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK & GS Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <div class="quiz-header">
            <h1>GK & GS Quiz</h1>
            <p>Test Your General Knowledge</p>
        </div>

        <div id="quiz-box">

            <div class="quiz-info">
                <span id="question-number">Question 1/15</span>
                <span id="timer">Time: 15s</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question">
                Question will appear here
            </h2>

            <div id="answer-buttons">
                <!-- Buttons will be created by JavaScript -->
            </div>

            <button id="next-btn">Next</button>

        </div>

        <div id="result-box" class="hide">

            <h2>Quiz Completed!</h2>

            <div class="result-circle">
                <span id="final-score">0</span>
                <small>/ 15</small>
            </div>

            <p id="result-message"></p>

            <div class="result-details">
                <p>Correct Answers: <span id="correct-count">0</span></p>
                <p>Wrong Answers: <span id="wrong-count">0</span></p>
                <p>Percentage: <span id="percentage">0%</span></p>
            </div>

            <button id="restart-btn">Play Again</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
